# Experiment-specific parameters for 000
# Quick baseline with lightweight ResNet for validation

exp_id: "000"

# Model
model:
  backbone: resnet18  # timm model name
  pretrained: true
  img_size: 224
  num_targets: 3  # Dry_Total_g, GDM_g, Dry_Green_g

# Training
training:
  epochs: 5  # Light run for validation
  batch_size: 16
  num_workers: 4
  
  # Loss weights (corresponding to primary targets)
  loss_weights:
    Dry_Total_g: 0.5
    GDM_g: 0.2
    Dry_Green_g: 0.1

# Optimizer
optimizer:
  name: AdamW
  lr: 1e-3
  weight_decay: 1e-2
  betas: [0.9, 0.999]

# Scheduler
scheduler:
  name: cosine_warmup  # transformers get_cosine_schedule_with_warmup
  warmup_ratio: 0.1
  num_cycles: 0.5

# EMA
ema:
  enabled: true
  decay: 0.999

# Data augmentation
augmentation:
  train:
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomBrightnessContrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.5
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  
  valid:
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

# Callbacks
callbacks:
  early_stopping:
    enabled: false
    patience: 5
    monitor: val_loss
  
  model_checkpoint:
    monitor: val_r2
    mode: max
    save_top_k: 1
    filename: model_best

# Misc
seed: 42
mixed_precision: true  # Use automatic mixed precision (AMP)
gradient_clip_val: 1.0
