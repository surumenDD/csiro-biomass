# Base configuration for exp001_baseline
# This file contains settings shared across all experiments in this folder

# Data paths
data:
  input_dir: /home/ryo52/work-kaggle/csiro/input
  train_csv: train.csv
  test_csv: test.csv
  train_img_dir: train
  test_img_dir: test

# Output paths
output:
  artifacts_base: /home/ryo52/work-kaggle/csiro/output/artifacts/experiments
  exp_name: exp001_baseline

# Cross-validation
cv:
  n_folds: 4
  group_col: Sampling_Date
  stratify_col: State
  seed: 42

# Targets
targets:
  # Primary targets (directly predicted by model)
  primary:
    - Dry_Total_g
    - GDM_g
    - Dry_Green_g
  
  # Derived targets (calculated from primary)
  derived:
    - Dry_Dead_g    # = max(0, Dry_Total_g - GDM_g)
    - Dry_Clover_g  # = max(0, GDM_g - Dry_Green_g)
  
  # All targets for OOF/submission
  all:
    - Dry_Total_g
    - GDM_g
    - Dry_Green_g
    - Dry_Dead_g
    - Dry_Clover_g

# Logging
logging:
  wandb:
    project: csiro-biomass
    entity: null  # Set to your wandb username or leave as null
    mode: offline  # Change to "online" when ready
  
  verbose: true
